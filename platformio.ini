[env:esp32dev]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
  -std=gnu++17
  -D CATFEEDER_VERSION=\"1.0.1-donder24\" 
  -D USE_NTP
build_unflags = 
  -std=gnu++11
monitor_filters = esp32_exception_decoder
extra_scripts = pre:gzip_embeds.py
board_build.partitions = min_spiffs.csv
board_build.embed_txtfiles = 
  data/style.css.gz
  data/index.html
  data/timers.html
  data/settings.html
  data/debuglogs.html
  data/firmware.html
  data/logs.html
  data/fillsensorsettings.html
  data/motorsettings.html
  data/networksettings.html
  data/networkchanged.html
  data/timesettings.html
  data/reset.html
  data/favicon.ico.gz
  data/logo.svg.gz
lib_ldf_mode=deep
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.11.2
	teemuatlut/TMCStepper@^0.7.3
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit_VL53L0X@^1.2.5
	bblanchon/ArduinoJson@^7.4.3
	janelia-arduino/TMC2209@^10.1.1
	gin66/FastAccelStepper@^1.2.7
